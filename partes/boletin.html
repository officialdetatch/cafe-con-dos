<section class="seccion seccion--boletin" id="suscribete" data-boletin>
  <div class="wrap">
    <div class="burbuja burbuja--naranja boletin">
      <div>
        <img class="taza" src="images/taza.png" alt="" width="92">
        <h2>Café para llevar</h2>
        <p>Te llega un email cuando publicamos algo nuevo: historias, opiniones, Sobremesa o un episodio. Cero spam.</p>
      </div>
      <form class="form-boletin" novalidate>
        <div class="campos">
          <div class="campo">
            <label class="sr-only" for="bol-nombre">Nombre</label>
            <input type="text" id="bol-nombre" name="nombre" autocomplete="given-name" placeholder="Nombre">
          </div>
          <div class="campo">
            <label class="sr-only" for="bol-email">Email</label>
            <input type="email" id="bol-email" name="email" autocomplete="email" required placeholder="Email">
          </div>
        </div>
        <input type="text" name="website" tabindex="-1" autocomplete="off" class="sr-only" aria-hidden="true">
        <button class="btn" type="submit">Suscribirme</button>
        <p class="aviso" role="status" hidden></p>
      </form>
    </div>
  </div>
</section>
