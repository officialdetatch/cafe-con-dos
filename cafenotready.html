<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- La portada de verdad ahora vive en index.html.
       Mientras el sitio no se lance (o con el modo mantenimiento prendido), la
       publicación automática (scripts/portada.js) pone aquí una copia de la portada
       para poder verla antes que nadie. Después del lanzamiento, este archivo solo
       manda a la portada, para que no se rompa el link guardado. No lo borres. -->
  <title>Café Con Dos</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://cafecondos.com/">
  <script>location.replace("./" + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=./">
</head>
<body>
  <p>La portada está en <a href="index.html">cafecondos.com</a>.</p>
</body>
</html>
