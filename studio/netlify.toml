# Publica el editor (Sanity Studio) en Netlify, en moderador.cafecondos.com.
# Netlify clona todo el repo (el editor lee ../assets/js/config.js) y construye
# solo esta carpeta. El sitio principal NO pasa por aquí: sigue en GitHub Pages.

[build]
  base    = "studio"
  command = "npm run build"
  publish = "dist"
  # Netlify cobra créditos por cada publicación (el plan gratis trae 300 al mes,
  # 15 por publicación). Esto evita publicar el editor cuando el cambio es solo del sitio
  # (páginas, estilos, artículos…): solo se construye si cambió algo de studio/, la
  # configuración (config.js) o la plantilla del boletín que usa la vista previa.
  # (Si el comando falla o no hay commit anterior, Netlify construye igual: es lo más seguro.)
  ignore  = 'git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../assets/js/config.js ../scripts/boletin-html.mjs'

[build.environment]
  NODE_VERSION = "22"

# El editor es una app de una sola página: cualquier dirección debe abrir index.html.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
